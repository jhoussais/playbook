
---
- name: Desactiver le mot de passe SSH
  hosts: all
  become: true

  tasks:
    - name: Interdire le mot de passe SSH pour ansible
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config
        block: |
          Match User ansible
              PasswordAuthentication no
      notify: Redemarrer SSH

  handlers:
    - name: Redemarrer SSH
      ansible.builtin.service:
        name: sshd
        state: restarted

