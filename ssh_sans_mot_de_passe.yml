
---
- name: Desactiver le mot de passe SSH pour ansible
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Configurer SSH pour le compte ansible
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-ansible-security.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          Match User ansible
              PasswordAuthentication no
              KbdInteractiveAuthentication no
        backup: true
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Recharger SSH

  handlers:
    - name: Recharger SSH
      ansible.builtin.service:
        name: sshd
        state: reloaded

